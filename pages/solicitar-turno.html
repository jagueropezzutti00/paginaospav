<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Turno Online | OSPAV MAIPU</title>
    <meta name="description" content="Sacá tu turno médico online en OSPAV Maipú. Elegí tu profesional y especialidad de forma rápida. Atención personalizada en Mendoza.">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/styles.css">

    <!-- TOASTIFY -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>

<body>

<header class="header bg-white sticky-top shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-light container">
        <div class="container-fluid">

            <div class="logo-wrapper d-flex align-items-center">
                <img src="../img/logo-obrasocial.png" alt="OSPAV Maipú" class="logo-img me-3">
                <h1 class="logo mb-0">OSPAV <span>MAIPU</span></h1>
            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="especialidades.html">Especialidades</a></li>
                    <li class="nav-item"><a class="nav-link" href="calendario.html">Calendario</a></li>
                    <li class="nav-item"><a class="nav-link active" href="solicitar-turno.html">Solicitar Turno</a></li>
                    <li class="nav-item"><a class="nav-link" href="cancelar-turno.html">Cancelar Turno</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    <li class="nav-item"><a class="nav-link btn-login ms-lg-3" href="login.html">Acceso Personal</a></li>
                </ul>
            </div>

        </div>
    </nav>
</header>

<main class="main container py-5 d-flex justify-content-center">

    <form class="form form-container shadow-sm p-4 bg-white rounded border" style="max-width: 600px; width: 100%;">

        <h2 class="h3 mb-4 text-primary-custom text-center fw-bold">
            Solicitud de Turno
        </h2>
        
        <!-- NOMBRE -->
        <div class="mb-3">
            <label class="form-label fw-bold">Apellido y Nombre:</label>
            <input id="nombre" type="text" class="form-control" placeholder="Ej: Pérez, Juan" required>
        </div>
        
        <!-- DNI + TEL -->
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">DNI:</label>
                <input id="dni" type="text" class="form-control" placeholder="Número de documento" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Teléfono:</label>
                <input id="telefono" type="tel" class="form-control" placeholder="261-XXXXXXX" required>
            </div>
        </div>

        <!-- ESPECIALIDAD -->
        <div class="mb-3">
            <label class="form-label fw-bold">Seleccione Especialidad:</label>
            <select class="form-select" id="especialidad" required>
                <option value="" disabled selected>Seleccione una especialidad...</option>
                <option value="Clínica">Clínica</option>
                <option value="Pediatría">Pediatría</option>
                <option value="Traumatología">Traumatología</option>
                <option value="Odontología">Odontología</option>
                <option value="Diabetología">Diabetología</option>
                <option value="Ginecología">Ginecología</option>
                <option value="Ecografías">Ecografías</option>
                <option value="Psicología">Psicología</option>
                <option value="Nutrición">Nutrición</option>
            </select>
        </div>

        <!-- MÉDICOS -->
        <div class="mb-3">
            <label class="form-label fw-bold">Seleccione Profesional:</label>
            <select class="form-select" id="medicos" required>
                <option value="" disabled selected>Seleccione un médico...</option>
            </select>
        </div>

        <!-- FECHA + HORA -->
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Fecha deseada:</label>
                <input id="fecha" type="date" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Hora:</label>
                <input id="hora" type="time" class="form-control" required>
            </div>
        </div>

        <button type="submit" class="btn-turno w-100 mt-3 border-0">
            ENVIAR SOLICITUD
        </button>

    </form>

</main>

<footer class="footer">
    <div class="footer-container">
        <div class="footer-column">
            <h3>Sede Maipú</h3>
            <p>Ozamis 1324 – Maipú</p>
        </div>
        <div class="footer-column">
            <h3>Horarios</h3>
            <p>Lunes a Viernes de 8:00 a 18:00 hs.</p>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

<script src="../js/app.js"></script>

</body>
</html>
