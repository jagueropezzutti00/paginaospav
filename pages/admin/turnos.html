<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Turnos | OSPAV</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/styles.css">

    <!-- TOASTIFY -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>

<body>

<!-- 🔐 PROTECCIÓN -->
<script>
if (sessionStorage.getItem("loginOK") !== "true") {
    window.location.href = "../login.html";
}
</script>

<header class="bg-white border-bottom py-3">
    <div class="container d-flex justify-content-between align-items-center">
        <h1 class="h4 mb-0">Panel de Turnos</h1>

        <button class="btn btn-outline-secondary btn-sm" onclick="logout()">
            Cerrar sesión
        </button>
    </div>
</header>

<main class="container py-5">

    <h2 class="mb-4">Turnos registrados</h2>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>DNI</th>
                <th>Teléfono</th>
                <th>Especialidad</th>
                <th>Médico</th>
                <th>Fecha</th>
                <th>Hora</th>
            </tr>
        </thead>

        <tbody id="tablaTurnos"></tbody>
    </table>

</main>

<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

<script>
function logout() {
    sessionStorage.removeItem("loginOK");

    Toastify({
        text: "Sesión cerrada",
        duration: 2000,
        gravity: "top",
        position: "right",
        style: { background: "#6c757d" }
    }).showToast();

    setTimeout(() => {
        window.location.href = "../login.html";
    }, 1000);
}

document.addEventListener("DOMContentLoaded", () => {

    const turnos = JSON.parse(localStorage.getItem("turnos")) || [];
    const tbody = document.getElementById("tablaTurnos");

    if (turnos.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="7" class="text-center text-muted">
                    No hay turnos registrados
                </td>
            </tr>
        `;
        return;
    }

    turnos.forEach(t => {
        const fila = document.createElement("tr");

        fila.innerHTML = `
            <td>${t.nombre}</td>
            <td>${t.dni}</td>
            <td>${t.telefono}</td>
            <td>${t.especialidad}</td>
            <td>${t.medico}</td>
            <td>${t.fecha}</td>
            <td>${t.hora}</td>
        `;

        tbody.appendChild(fila);
    });

});
</script>

</body>
</html>
